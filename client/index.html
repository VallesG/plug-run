<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plug Run — Run the Block</title>
    <meta name="description" content="15 houses. One daily block. Grab the stash, lose the Plug, and make it to the getaway car." />
    <meta name="theme-color" content="#10171c" />

    <!-- Mobile-first: lock scale, prevent zoom -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <!-- Shared vector route mark; PNGs retained as older-browser fallbacks. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="/brand/plug-run-mark.svg">
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M68K7J4ZZ2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // On /tg (the Telegram Mini App) the address carries Telegram's signed
      // user data in its #fragment until the game strips it, so the game
      // sends that page view itself (src/platform/index.js).
      gtag('config', 'G-M68K7J4ZZ2', {
        'anonymize_ip': true,
        'cookie_flags': 'SameSite=None;Secure',
        'send_page_view': !/^\/tg(\/|$)/.test(location.pathname)
      });
    </script>


    <style>
      /* Fill screen, dark theme, no scrollbars */
      html, body, #app {
        margin: 0;
        height: 100%;
        background: #0b0b12;
        color: #fff;
        overflow: hidden; /* no scrolling on mobile */
      }

      /* Let Phaser handle all touch gestures (no double-tap zoom, no pull-to-refresh) */
      canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        display: block; /* remove tiny gaps on some browsers */
      }

      /* Zoom warning banner */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
