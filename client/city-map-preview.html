<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plug Run — city map review</title>
<style>
body{margin:0;background:#07090b;color:#e9dfc7;font:13px Arial,sans-serif}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button{background:#172124;color:#e9dfc7;border:1px solid #687769;padding:8px}#game{margin:0 auto;max-width:100%;overflow:auto}
</style>
<header>City-map prototype · no saves
<select id="size"><option>390x844</option><option>280x480</option><option>1440x900</option></select>
<select id="state"><option value="start">First arrival</option><option value="mixed">Mixed crew claims</option><option value="finish">City complete</option><option value="legacy">Legacy save</option></select>
<button id="review">Review</button></header><div id="game"></div>
<script type="module">
import Phaser from 'phaser';
import GameUI from './src/controllers/GameUI.js';
import { drawCityMap } from './src/controllers/CityMap.js';
import { cityView, createCityState } from './src/logic/city.js';
let game;
function review(){
 game?.destroy(true);
 const [width,height]=document.querySelector('#size').value.split('x').map(Number);
 const choice=document.querySelector('#state').value;
 const checkpoint=choice==='finish'?{blockIndex:11,pveRound:1}:choice==='mixed'?{blockIndex:7,pveRound:9}:choice==='legacy'?{blockIndex:24,pveRound:6}:{blockIndex:1,pveRound:1};
 const owners=choice==='legacy'?{}:Object.fromEntries(Array.from({length:checkpoint.blockIndex-1},(_,i)=>[i+1,['crossline','iron-row','afterlight'][i%3]]));
 const state=createCityState({completedThrough:checkpoint.blockIndex-1,owners},checkpoint);
 class Preview extends Phaser.Scene{
  constructor(){super('CITY_REVIEW');}
  create(){
   this.role='runner';this.suspendTouchUI=()=>{};this.gameUI=new GameUI(this);
   const view=cityView(state,checkpoint,choice==='finish'?1:undefined);
   let modal,art;
   const draw=()=>{
    modal=this.gameUI.showModal({fullScreen:true,inputDelay:0,title:view.city.name,
     subtitle:'CITY '+view.city.number+' · '+view.stashes+' / 150 STASHES',
     buttons:[{label:choice==='finish'?'NEW CITY UNLOCKED >>':'ZOOM INTO CURRENT BLOCK',keepOpen:true,variant:'primary',
       onClick:()=>art?.focus(checkpoint.blockIndex,()=>{modal.destroy();draw();})},
      {pair:[{label:'PREVIOUS CITY',disabled:true},{label:'REVIEW AGAIN',onClick:draw}]}]});
    art=drawCityMap(this,modal,{view,claimedBlock:choice==='finish'?10:null,onSelect:()=>art?.focus(checkpoint.blockIndex,()=>{modal.destroy();draw();})});
   };draw();
  }
 }
 game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width,height,backgroundColor:'#07090b',pixelArt:true,scene:Preview});
}
document.querySelector('#review').onclick=review;review();
</script></html>
